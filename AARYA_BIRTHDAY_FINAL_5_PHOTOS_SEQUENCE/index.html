:11px auto}\n .wrap{width:90vw;height:62vh;top:53%}\n .letter{padding:25px 25px}\n .letter:before{inset:9px}\n .letter h2{font-size:22px;margin:8px 0 14px}\n .body{font-size:12.5px;line-height:1.55}\n .body p{margin-bottom:9px}.sign{font-size:15px;margin-top:5px}\n button{bottom:3vh;padding:10px 16px;font-size:9px}\n}\n@media(max-height:700px){\n .heading{top:3.5vh}.wrap{height:63vh;top:51%}\n .body{font-size:12.5px;line-height:1.52}.body p{margin-bottom:7px}\n}\n\u003c/style\u003e\u003c/head\u003e\n\u003cbody\u003e\u003cmain class=\"page\"\u003e\n\u003cdiv class=\"stars\"\u003e\u003c/div\u003e\u003cdiv class=\"glow\"\u003e\u003c/div\u003e\n\u003cheader class=\"heading\"\u003e\u003cdiv class=\"kicker\"\u003echapter three\u003c/div\u003e\u003ch1\u003eA Little \u003cem\u003eLetter\u003c/em\u003e For You\u003c/h1\u003e\u003cdiv class=\"rule\"\u003e\u003c/div\u003e\u003c/header\u003e\n\u003csection class=\"wrap\"\u003e\u003carticle class=\"letter\"\u003e\u003cdiv class=\"content\"\u003e\n\u003cdiv class=\"ornament\"\u003e✦ \u0026nbsp; ✦ \u0026nbsp; ✦\u003c/div\u003e\u003ch2\u003eTo Aarya\u003c/h2\u003e\n\u003cdiv class=\"body\"\u003e\n\u003cp\u003eSome people quietly make ordinary days feel a little more beautiful.\u003c/p\u003e\n\u003cp\u003eYou are one of those people. Your smile, your little moments, and the memories you create without even trying are all worth keeping close.\u003c/p\u003e\n\u003cp\u003eSo on your birthday, I wanted to leave you a small chapter of words — simple, honest, and written especially for you.\u003c/p\u003e\n\u003cp\u003eMay this year bring you beautiful moments, genuine smiles, peaceful days, and countless reasons to be happy.\u003c/p\u003e\n\u003cp\u003eAnd whenever you look back at this little birthday surprise, I hope it brings a smile back to you.\u003c/p\u003e\n\u003c/div\u003e\u003cdiv class=\"sign\"\u003eWith a little smile ✦\u003c/div\u003e\n\u003c/div\u003e\u003c/article\u003e\u003c/section\u003e\n\u003cbutton class=\"back\" onclick=\"parent.postMessage({type:'AARYA_PAGE',page:2},'*')\"\u003e← BACK TO PAGE TWO\u003c/button\u003e\u003cbutton class=\"next\" onclick=\"parent.postMessage({type:'AARYA_PAGE',page:4},'*')\"\u003eCONTINUE TO THE SURPRISE ✦\u003c/button\u003e\n\u003c/main\u003e\u003c/body\u003e\u003c/html\u003e`;const S4=`\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n\u003ctitle\u003eAarya — The Final Surprise\u003c/title\u003e\n\u003cstyle\u003e\n*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}\nbody{font-family:Georgia,\"Times New Roman\",serif;background:#060207;color:#fff}\n.page{position:relative;width:100vw;height:100vh;overflow:hidden;background:\nradial-gradient(circle at 50% 45%,#4b182f 0,#1d0916 38%,#050207 100%)}\n.glow{position:absolute;left:50%;top:47%;width:48vw;height:48vw;transform:translate(-50%,-50%);\nborder-radius:50%;background:#ff5b91;filter:blur(95px);opacity:.11}\n.particles{position:absolute;inset:0;pointer-events:none;background-image:\nradial-gradient(circle,#ffd5e5 0 1px,transparent 1.5px),radial-gradient(circle,#ff9bbb 0 1px,transparent 1.5px);\nbackground-size:190px 190px,280px 280px;opacity:.25;animation:float 22s linear infinite}\n@keyframes float{to{background-position:120px -80px,-100px 100px}}\n\n.heading{position:absolute;top:5vh;left:0;width:100%;text-align:center;z-index:5}\n.kicker{font:10px Arial,sans-serif;letter-spacing:6px;text-transform:uppercase;color:#dcaabd}\nh1{margin:10px 0 0;font-size:clamp(34px,5vw,64px);font-weight:400;color:#fff3f7}\nh1 em{color:#ff9fc2;font-style:italic}.rule{width:75px;height:1px;background:#f4a5c0;margin:14px auto}\n\n.stage{position:absolute;inset:20vh 5vw 9vh;display:flex;align-items:center;justify-content:center;perspective:1200px}\n.cake-area{position:relative;width:min(470px,54vw);height:min(450px,56vh);display:flex;align-items:center;justify-content:center;z-index:3}
.plate{position:absolute;bottom:4%;width:88%;height:44px;border-radius:50%;background:radial-gradient(ellipse at center,#fffdfd 0 30%,#ead7dc 31% 47%,#9f7182 48% 53%,#28141f 54% 100%);box-shadow:0 18px 35px #000b,0 3px 4px #fff5 inset}
.cake{position:relative;width:min(430px,82vw);height:min(370px,52vh);margin-top:0;cursor:pointer;filter:drop-shadow(0 26px 28px #000a);transform-style:preserve-3d;transition:transform .45s ease;display:flex;align-items:center;justify-content:center}
.cake:hover{transform:translateY(-5px) scale(1.012)}
.cake-real{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 14px 14px #0004)}
.plate{display:none!important}
.candle{position:absolute;left:50%;top:4%;transform:translateX(-50%);width:16px;height:72px;border-radius:8px;background:repeating-linear-gradient(135deg,#fffaf9 0 8px,#e89aae 8px 16px);box-shadow:0 5px 12px #0006;z-index:8}
.flame{position:absolute;left:50%;top:-27px;transform:translateX(-50%) rotate(45deg);width:22px;height:22px;border-radius:70% 35% 70% 35%;background:radial-gradient(circle at 35% 35%,#fff8b0 0 20%,#ffd35d 32%,#ff8c3a 62%,#ff5b2e 78%,transparent 80%);filter:drop-shadow(0 0 9px #ffb23d);animation:flicker .16s infinite alternate}
@keyframes flicker{from{transform:translateX(-50%) rotate(42deg) scale(.94)}to{transform:translateX(-50%) rotate(49deg) scale(1.08)}}
.smoke{display:none;position:absolute;left:50%;top:-34px;width:12px;height:30px;border-radius:50%;border:2px solid #d7c6cf88;border-left-color:transparent;border-bottom-color:transparent;transform:translateX(-50%) rotate(25deg);animation:smoke 1.7s ease-out forwards}
@keyframes smoke{from{opacity:.8;transform:translateX(-50%) translateY(0) rotate(25deg) scale(.7)}to{opacity:0;transform:translateX(-30%) translateY(-38px) rotate(50deg) scale(1.5)}}
.cake-area.blown .flame{display:none}.cake-area.blown .smoke{display:block}
.hint{position:absolute;bottom:-1%;left:50%;transform:translateX(-50%);white-space:nowrap;font:11px Arial,sans-serif;letter-spacing:1.5px;color:#e9cbd5;transition:opacity .4s}
.cake-area.blown .hint{opacity:.55}
.gifts{position:absolute;left:0;right:0;top:7%;bottom:0;z-index:6;pointer-events:none}\n.gift{position:absolute;width:clamp(100px,12vw,145px);height:clamp(100px,12vw,145px);cursor:pointer;pointer-events:auto;transition:transform .55s}\n.gift:hover{transform:translateY(-9px) scale(1.04)}\n.g1{left:2%;bottom:7%}.g2{right:2%;bottom:7%}.g3{right:5%;top:15%}\n.box{position:absolute;left:8%;right:8%;bottom:8%;height:58%;border-radius:5px;\nbackground:linear-gradient(135deg,#bd4772,#7b183e);box-shadow:0 18px 30px #0009;transition:.6s;transform-origin:bottom}\n.lid{position:absolute;left:4%;right:4%;bottom:60%;height:20%;border-radius:5px;\nbackground:linear-gradient(135deg,#f59ab6,#9f2857);box-shadow:0 7px 10px #0005;transition:.6s;transform-origin:bottom}\n.ribbon-v{position:absolute;left:43%;bottom:8%;width:14%;height:84%;background:#ffd6e3aa}\n.ribbon-h{position:absolute;left:4%;right:4%;bottom:37%;height:14%;background:#ffd6e3aa}\n.gift.open .lid{transform:translateY(-42px) rotate(-9deg)}.gift.open .box{transform:scaleY(.92)}\n.present{position:absolute;left:50%;bottom:50%;transform:translate(-50%,50%) scale(.2);opacity:0;\nfont-size:clamp(35px,4vw,55px);transition:.7s;z-index:2;filter:drop-shadow(0 8px 10px #0006)}\n.gift.open .present{transform:translate(-50%,-12%) scale(1);opacity:1}\n.gift-label{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;\nfont:9px Arial;letter-spacing:2px;color:#e8c7d3}\n.message{position:absolute;z-index:100;pointer-events:none;left:50%;top:54%;transform:translate(-50%,-50%) scale(.8);\nwidth:min(460px,82vw);padding:28px;text-align:center;border:1px solid #ffb5cb66;border-radius:12px;\nbackground:#12050dbd;backdrop-filter:blur(14px);box-shadow:0 25px 70px #000b;opacity:0;pointer-events:none;transition:.6s}\n.message.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}\n.message h2{font-size:28px;font-weight:400;color:#ffadc8;margin:0 0 10px}.message p{font:13px/1.6 Arial;color:#edd7df;margin:0}\n.close{margin-top:17px;position:static}\n\n.chapter-back{position:absolute;left:4vw;bottom:3.5vh;z-index:200;padding:10px 16px;border:1px solid #ffb2cb66;border-radius:999px;background:#16060ebd;color:#f9dce8;font:9px Arial;letter-spacing:2px;cursor:pointer}.chapter-back:hover{background:#351126}\n@media(max-width:750px){\n .stage{inset:20vh 3vw 10vh}\n .cake-area{width:64vw;height:48vh}
 .cake{width:min(330px,88%);height:min(240px,58%)}
 .strawberry{width:34px;height:40px}
 .candle{height:56px}\n .g1{left:0;bottom:1%}.g2{right:0;bottom:1%}.g3{right:0;top:6%}\n .gift{width:100px;height:100px}.gift-label{font-size:8px}\n}\n\u003c/style\u003e\u003c/head\u003e\n\u003cbody\u003e\n\u003cmain class=\"page\"\u003e\u003cbutton type=\"button\" class=\"chapter-back\" onclick=\"parent.postMessage({type:'AARYA_PAGE',page:3},'*')\"\u003e← BACK TO LETTER\u003c/button\u003e\n\u003cdiv class=\"glow\"\u003e\u003c/div\u003e\u003cdiv class=\"particles\"\u003e\u003c/div\u003e\n\u003cheader class=\"heading\"\u003e\u003cdiv class=\"kicker\"\u003ethe final surprise\u003c/div\u003e\u003ch1\u003eOne Last Little \u003cem\u003eSurprise\u003c/em\u003e\u003c/h1\u003e\u003cdiv class=\"rule\"\u003e\u003c/div\u003e\u003c/header\u003e\n\n\u003csection class=\"stage\"\u003e\n \u003cdiv class=\"cake-area\" id=\"cakeArea\" onclick=\"blowCandles()\"\u003e\n  \u003cdiv class=\"plate\"\u003e\u003c/div\u003e
  \u003cdiv class=\"cake\"\u003e
   \u003cimg class=\"cake-real\" src=\"cake-realistic.png\" alt=\"Realistic strawberry birthday cake\"\u003e
   \u003cdiv class=\"candle\"\u003e\u003ci class=\"flame\"\u003e\u003c/i\u003e\u003ci class=\"smoke\"\u003e\u003c/i\u003e\u003c/div\u003e
  \u003c/div\u003e
  \u003cdiv class=\"hint\"\u003eClick the cake to blow out the candles 🕯️\u003c/div\u003e\n \u003c/div\u003e\n\n \u003cdiv class=\"gifts\"\u003e\n  \u003cdiv class=\"gift g1\" onclick=\"openGift(this,'🌹','A little bouquet, just for you.')\"\u003e\n   \u003cdiv class=\"present\"\u003e🌹\u003c/div\u003e\u003cdiv class=\"box\"\u003e\u003cspan class=\"ribbon-v\"\u003e\u003c/span\u003e\u003cspan class=\"ribbon-h\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"lid\"\u003e\u003c/div\u003e\u003cdiv class=\"gift-label\"\u003ePINK ROSE\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"gift g2\" onclick=\"openGift(this,'🍫','A little sweetness for your day.')\"\u003e\n   \u003cdiv class=\"present\"\u003e🍫\u003c/div\u003e\u003cdiv class=\"box\"\u003e\u003cspan class=\"ribbon-v\"\u003e\u003c/span\u003e\u003cspan class=\"ribbon-h\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"lid\"\u003e\u003c/div\u003e\u003cdiv class=\"gift-label\"\u003eCHOCOLATE\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"gift g3\" onclick=\"openGift(this,'🧸','A small teddy, just to bring you a little smile.')\"\u003e\n   \u003cdiv class=\"present\"\u003e🧸\u003c/div\u003e\u003cdiv class=\"box\"\u003e\u003cspan class=\"ribbon-v\"\u003e\u003c/span\u003e\u003cspan class=\"ribbon-h\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"lid\"\u003e\u003c/div\u003e\u003cdiv class=\"gift-label\"\u003eTEDDY GIFT\u003c/div\u003e\n  \u003c/div\u003e\n \u003c/div\u003e\n\u003c/section\u003e\n\n\u003cdiv class=\"message\" id=\"message\"\u003e\u003ch2 id=\"msgIcon\"\u003e🌹\u003c/h2\u003e\u003cp id=\"msgText\"\u003e\u003c/p\u003e\u003cbutton type=\"button\" class=\"close\" id=\"closeMessageBtn\"\u003eCLOSE\u003c/button\u003e\u003c/div\u003e\n\u003c/main\u003e\n\u003cscript\u003e\nlet activeGift=null;\nconst giftMessages={\n  g1:{icon:'🌹',text:'A little bouquet, just for you.'},\n  g2:{icon:'🍫',text:'A little sweetness for your day.'},\n  g3:{icon:'🧸',text:'A small teddy, just to bring you a little smile.'}\n};\n\nfunction blowCandles(){\n const area=document.getElementById('cakeArea');\n if(area.classList.contains('blown')) return;\n area.classList.add('blown');\n}\n\nfunction openGift(el){\n const key=el.classList.contains('g1')?'g1':el.classList.contains('g2')?'g2':'g3';\n if(!el.classList.contains('open')) el.classList.add('open');\n activeGift=el;\n document.getElementById('msgIcon').textContent=giftMessages[key].icon;\n document.getElementById('msgText').textContent=giftMessages[key].text;\n document.getElementById('message').classList.add('show');\n}\n\nfunction closeMessage(){\n document.getElementById('message').classList.remove('show');\n}\n\ndocument.getElementById('closeMessageBtn').addEventListener('click',function(e){\n e.preventDefault();\n e.stopPropagation();\n closeMessage();\n});\n\ndocument.getElementById('message').addEventListener('click',function(e){\n if(e.target===this) closeMessage();\n});\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e`;
const a12=document.getElementById('a12'),a3=document.getElementById('a3'),a4=document.getElementById('a4');
a12.srcdoc=S12;a3.srcdoc=S3;a4.srcdoc=S4;
function allOff(){a12.classList.remove('active');a3.classList.remove('active');a4.classList.remove('active');}
function show(n){
 allOff();
 if(n===1||n===2){
   a12.classList.add('active');
   try{
    const d=a12.contentDocument, scene=d.querySelector('.scene'), p2=d.getElementById('page2');
    if(n===1){if(scene)scene.style.display='block';if(p2)p2.classList.remove('active');}
    else{if(scene)scene.style.display='none';if(p2)p2.classList.add('active');bindA12Navigation();}
   }catch(e){}
 } else if(n===3)a3.classList.add('active');
 else if(n===4)a4.classList.add('active');
}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='AARYA_PAGE')show(+e.data.page);});
function ready(){document.getElementById('loading').style.display='none';}

// Parent-side navigation fallback: this keeps the chapter buttons working
// even when a browser blocks/interrupts JavaScript inside a local srcdoc iframe.
function bindA12Navigation(){
  try{
    const d=a12.contentDocument;
    if(!d) return;
    const enter=d.querySelector('.enter');
    const next=d.querySelector('.next-chapter');
    const back=d.querySelector('.page2-next:not(.next-chapter)');
    if(enter && !enter.dataset.parentBound){
      enter.dataset.parentBound='1';
      enter.addEventListener('click',function(ev){
        ev.preventDefault(); ev.stopPropagation();
        const scene=d.querySelector('.scene'), p2=d.getElementById('page2');
        if(scene){scene.style.transition='opacity 1s ease';scene.style.opacity='0';}
        setTimeout(function(){
          if(scene) scene.style.display='none';
          if(p2) p2.classList.add('active');
        },900);
      },true);
    }
    if(next && !next.dataset.parentBound){
      next.dataset.parentBound='1';
      next.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();show(3);},true);
    }
    if(back && !back.dataset.parentBound){
      back.dataset.parentBound='1';
      back.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();show(1);},true);
    }
  }catch(e){}
}
function readyAll(){ready(); bindA12Navigation();}
a12.onload=readyAll;
a3.onload=ready;
a4.onload=ready;
setTimeout(function(){ready();bindA12Navigation();},1200);
setTimeout(function(){ready();bindA12Navigation();},3500);
</script></body></html>
